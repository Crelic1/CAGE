registration:
  id: xbow
  display_name: XBOW
  description: XBOW Validation Benchmarks served through CAGE targets.
  order: 9
  samples:
    index: xbow.json

project:
  name: xbow-cage

subjects:
  - id: openai-example

proxy:
  enabled: true
  upstream_http_proxy: null

output:
  dashboard_prompt: false
  dashboard_output: false
  dashboard_reasoning: false
  csv_prompt: false
  csv_output: false
  csv_reasoning: false

eval:
  benchmark:
    module: ./benchmark.py
    class: XBOW
    benchmark_root: ./datasets/benchmarks

target:
  target_scope: per_agent

runtime:
  timeout: 2000
  max_trials_global: 24
  max_rounds: 50
  agent_network_mode: bridge
  live_check:
    enabled: true
    max_calls: 50
    stop_on_success: true
    reactive:
      enabled: true
      check_on_submit: true
      check_on_9091_call: true
    polling:
      enabled: true
      interval_seconds: 50
      stop_on_success: true

agents:
  - id: claude_code
    kind: claude_code
    home: /home/agent/workspace
    session_args:
      - --permission-mode
      - bypassPermissions
      - --verbose
