models:
  # ======================================================================
  #  CAGE model registry — example / template
  # ======================================================================
  #  Copy this file to `config/models.yml`, then fill in your endpoints:
  #
  #      cp config/models.example.yml config/models.yml
  #
  #  `config/models.yml` is gitignored — keep real keys there, never here.
  #  Secrets are written as `${ENV_VAR}` refs and expanded at load time, so
  #  the literal key never lives in any file on disk.
  #
  #  Each top-level key below is a model *id* — the name you pass to
  #  `--model <id>` or list under `agents:` in project.yml. An id maps to ONE
  #  upstream endpoint; CAGE routes every LLM call through its in-container
  #  proxy to that endpoint, translating the wire protocol when the agent and
  #  the endpoint disagree.
  #
  # ----------------------------------------------------------------------
  #  FIELDS
  # ----------------------------------------------------------------------
  #  Required
  #    provider   Wire-protocol family. Decides how CAGE talks to the endpoint:
  #                 openai | vllm | sglang   -> OpenAI Chat Completions protocol
  #                 gemini | google          -> Google Generative Language API
  #                                             (generateContent; for the
  #                                             gemini_cli agent)
  #                 anthropic (or any other) -> Anthropic Messages protocol
  #               `vllm`/`sglang` additionally mark the endpoint as *self-hosted*
  #               — the only kind eligible for `--wait-for-model` startup polling
  #               (SaaS providers are assumed always up).
  #    model      The model string sent upstream, i.e. the provider's own name.
  #    max_context_size
  #               This endpoint's context window, in tokens.
  #
  #               Agents summarise their conversation before it outgrows the
  #               window ("compaction"). Every CLI CAGE drives takes that budget
  #               as an absolute token count, so somebody has to supply the
  #               number — and the only party who knows it is whoever stood the
  #               endpoint up. CAGE will not guess: a missing value is an error
  #               at load time, not a silent default.
  #
  #               It belongs to the *deployment*, not the model. The same
  #               weights served by two hosts can enforce very different limits,
  #               and a server's advertised limit is not always the one it
  #               enforces — one endpoint below reports a 1M window while
  #               refusing anything past ~224k. Treat the model card as a hint
  #               and your endpoint as the authority.
  #
  #               To find the real number, send a deliberately oversized request
  #               and read the limit back out of the rejection; most servers
  #               name it. Guess *low* if you must: too small only makes the
  #               agent compact sooner than it had to, while too large means it
  #               never compacts at all and every long trial dies at the wall.
  #               The values below are conservative starting points.
  #
  #  Auth — pick the ONE style that fits the endpoint
  #    api_key    A single key, normally an env ref e.g. ${OPENAI_API_KEY}.
  #               This is the common case.
  #    api_keys   A *pool* of keys for the same endpoint — several accounts /
  #               quotas. When non-empty it OVERRIDES api_key, and CAGE rotates
  #               across the pool to load-balance concurrent trials. Use this
  #               INSTEAD of api_key only when you want to spread load over
  #               multiple accounts. (Internally: pool = api_keys if set, else
  #               [api_key].)
  #    auth_source  ONLY for subscription / OAuth agents logged in with an
  #               account instead of an API key: Claude Code (Max/Pro) or Codex
  #               ("Sign in with ChatGPT"). Points at a host directory holding
  #               the agent's OAuth credential file (`.credentials.json` for
  #               Claude Code, `.codex/auth.json` for Codex), which CAGE
  #               bind-mounts into the agent container. In this mode base_url and
  #               api_key are left empty. Almost no endpoint needs this — leave
  #               it out entirely unless you actually run subscription mode.
  #
  #  Optional (have sensible defaults — omit unless you need to override)
  #    base_url            Endpoint URL. Required for normal API / self-hosted
  #                        endpoints; empty only in subscription (auth_source) mode.
  #    agent_model_names   Per-agent override of `model`, for when a specific
  #                        agent CLI expects a different launch name, e.g.
  #                          agent_model_names: {claude_code: claude-opus-4-7[1m]}
  #    timeout             Per-request timeout in seconds. Default: 360.
  #    max_retries         Upstream retry attempts. Default: 2.
  #    input_cost_per_1m   USD per 1M input tokens — for cost accounting only.
  #    output_cost_per_1m  USD per 1M output tokens.  (Both unset => not tracked.)
  #    extra_headers       Extra HTTP headers sent upstream, e.g. {X-Title: cage}.
  #    reserved_context_size  How much of the window to hold back for the reply,
  #                        for CLIs that want that spelled out separately rather
  #                        than deriving it (kimi_code). Most CLIs pick their own
  #                        reply ceiling and subtract it themselves, so leaving
  #                        this unset is normal.
  #    context_window_size  Accepted alias for max_context_size (qwen naming).
  #    rl_reward_sink      RL training integration. Set this to the URL of an
  #                        external trainer's reward sink to put the model in
  #                        "RL mode": every LLM call it drives carries an
  #                        `X-Trial-Id` header (so the trainer can group one
  #                        trajectory's calls), and each finished trial's reward
  #                        is POSTed here as JSON `{trial_id, reward, success,
  #                        sample_id, metrics}`. The reward number comes from the
  #                        benchmark (`Benchmark.reward`, default = its score).
  #                        Omit ⇒ an ordinary model, behaviour identical. This is
  #                        the ONLY switch — the whole feature toggles from here.
  # ======================================================================

  # --- OpenAI-protocol SaaS, single key --------------------------------
  gpt-5.5:
    provider: openai
    model: gpt-5.5
    max_context_size: 272000   # OpenAI gpt-5.5
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout: 3600
    # Cost accounting is optional; set real numbers to track $ per run:
    # input_cost_per_1m: 1.25
    # output_cost_per_1m: 10.0

  # --- Multi-account key POOL (use api_keys, not api_key) ---------------
  #     CAGE rotates trials across these keys to spread quota/load.
  openai-example:
    provider: openai
    model: gpt-5.5
    max_context_size: 272000   # OpenAI gpt-5.5
    base_url: https://api.openai.com/v1
    api_keys:
      - ${OPENAI_API_KEY}
      - ${OPENAI_API_KEY_2}

  # --- Self-hosted vLLM (OpenAI protocol, --wait-for-model eligible) ----
  vllm-example:
    provider: vllm
    model: local-model
    max_context_size: 131072   # YOUR deployment decides this — check it, do not copy
    base_url: http://127.0.0.1:8000/v1
    api_key: ${VLLM_API_KEY}   # self-hosted servers often accept any/empty key
    # Declare the model's real context window so kimi_code / qwen_code size their
    # auto-compaction to it instead of a CLI default. Omit ⇒ the CLI default
    # stands; CAGE will not invent one. (claude_code can't use this — see the
    # FIELDS note above: the Claude Code CLI has no custom-window knob.)
    # max_context_size: 262144
    # reserved_context_size: 20000      # output headroom kept free (kimi_code)

  # --- RL training policy (verl etc.) — OpenAI endpoint + reward sink ----
  #     The trainer serves the in-training policy as an OpenAI-compatible
  #     endpoint; CAGE drives it like any OpenAI model. Adding `rl_reward_sink`
  #     is the whole switch: trial ids ride on every call and rewards are
  #     reported back. Drop that one line and this is a plain model again.
  rl-policy:
    provider: openai
    model: rl-policy
    max_context_size: 131072   # YOUR deployment decides this — check it, do not copy
    base_url: ${RL_ENDPOINT}          # trainer's OpenAI-compatible policy server
    api_key: dummy                    # trainer usually ignores the key
    rl_reward_sink: ${RL_REWARD_SINK}  # where per-trial rewards are POSTed

  # --- Anthropic SaaS, single key --------------------------------------
  claude-opus:
    provider: anthropic
    model: claude-opus-4-7
    max_context_size: 200000   # Anthropic standard window
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 3600

  # --- Subscription / OAuth (auth_source) — Claude Code & Codex ---------
  #     No base_url / api_key: the agent logs in with a subscription account
  #     and CAGE bind-mounts the host credentials into the container, keeping
  #     the on-disk OAuth token fresh via a host-side refresher for the run.
  claude-opus-sub:
    provider: anthropic
    model: claude-opus-4-7
    max_context_size: 200000   # Anthropic standard window
    agent_model_names:
      claude_code: claude-opus-4-7[1m]   # decorated launch name (e.g. [1m] = 1M context)
    auth_source: ${CAGE_CLAUDE_AUTH_SOURCE}   # host dir with .credentials.json

  # --- Codex "Sign in with ChatGPT" (OAuth). Run `codex login` on the host
  #     first so ~/.codex/auth.json holds the ChatGPT OAuth tokens; point
  #     auth_source at that dir (or the file). No base_url / api_key — the proxy
  #     forwards the OAuth Bearer to the ChatGPT Codex backend. Use with
  #     `--agent codex`.
  codex-chatgpt:
    provider: openai
    model: gpt-5-codex
    max_context_size: 272000   # OpenAI gpt-5-codex
    auth_source: ${CAGE_CODEX_AUTH_SOURCE}   # host dir with .codex/auth.json (e.g. ~/.codex)

  # --- OpenAI ChatGPT subscription / Codex OAuth -----------------------
  #     The Codex agent read-only mounts auth.json and routes through the
  #     ChatGPT Codex backend. It never substitutes an API key in this mode.
  gpt-5.6-sol-chatgpt:
    provider: openai
    model: gpt-5.6-sol
    max_context_size: 272000   # conservative Codex-family starting point; verify your endpoint
    auth_source: ${CAGE_CODEX_AUTH_SOURCE}    # host dir containing auth.json
    timeout: 3600

  # --- Anthropic-compatible 3rd party (custom base_url + agent name) ----
  deepseek-v4-pro:
    provider: anthropic
    model: deepseek-v4-pro
    max_context_size: 1000000   # DeepSeek V4: 1M
    agent_model_names:
      claude_code: deepseek-v4-pro[1m]
    base_url: https://api.deepseek.com/anthropic
    api_key: ${DEEPSEEK_API_KEY}
    timeout: 3600

  deepseek-v4-flash:
    provider: anthropic
    model: deepseek-v4-flash
    max_context_size: 1000000   # DeepSeek V4: 1M
    agent_model_names:
      claude_code: deepseek-v4-flash
    base_url: https://api.deepseek.com/anthropic
    api_key: ${DEEPSEEK_API_KEY}
    timeout: 3600

  # --- Self-hosted OpenAI-compatible server -----------------------------
  local-openai-compatible:
    provider: openai
    model: local-model
    max_context_size: 131072   # YOUR deployment decides this — check it, do not copy
    base_url: http://127.0.0.1:8000/v1
    api_key: ${LOCAL_MODEL_API_KEY}
    timeout: 3600

  glm-5.1:
    provider: openai
    model: GLM-5.1
    max_context_size: 200000   # GLM-5.1: 200K (GLM-5.2 is 1M)
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key: ${GLM_API_KEY}
    timeout: 3600

  qwen3.5-397b-w8a8:
    provider: vllm
    model: qwen3.5-397b-w8a8
    max_context_size: 131072   # self-hosted — YOUR deployment decides this
    base_url: http://127.0.0.1:8000/v1
    api_key: ${SII_API_KEY}
    timeout: 3600

  qwen3.6-max-preview:
    provider: openai
    model: qwen3.6-max-preview
    max_context_size: 262144   # Qwen3.6-Max-Preview: 256K
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${QWEN_API_KEY}
    timeout: 3600

  qwen3.7-max:
    provider: openai
    model: qwen3.7-max
    max_context_size: 1000000   # Qwen3.7-Max: 1M
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${QWEN_API_KEY}
    timeout: 3600

  kimi-k2.6-cli:
    provider: openai
    model: kimi-k2.6
    max_context_size: 262144   # Kimi K2.6: 256K (K3 is 1M)
    base_url: https://api.moonshot.cn/v1
    api_key: ${KIMI_API_KEY}
    timeout: 3600

  # StepFun (阶跃星辰) serves BOTH protocols, so pick by the agent you run.
  #
  # Anthropic Messages — the native path for claude_code. StepFun's own Claude
  # Code guide sets ANTHROPIC_BASE_URL=https://api.stepfun.com/step_plan, and the
  # proxy builds `{base_url}/v1/messages`, landing on exactly that endpoint. With
  # `provider: anthropic` the traffic is forwarded byte-for-byte — no
  # anthropic->openai translation, and no CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
  # needed on the agent.
  step-3.7-flash:
    provider: anthropic
    model: step-3.7-flash
    max_context_size: 262144   # StepFun step-3.7: 256K — also measured against the live endpoint
    base_url: https://api.stepfun.com/step_plan
    api_key: ${STEPFUN_API_KEY}
    timeout: 3600

  # OpenAI Chat Completions — same models, for the natively-OpenAI agents
  # (codex / qwen_code / kimi_code). Note the different base_url: /v1 here,
  # /step_plan above.
  step-3.7-flash-oai:
    provider: openai
    model: step-3.7-flash
    max_context_size: 262144   # StepFun step-3.7: 256K — also measured against the live endpoint
    base_url: https://api.stepfun.com/v1
    api_key: ${STEPFUN_API_KEY}
    timeout: 3600
    # StepFun accepts OpenAI's `reasoning_effort`. Where extra_body actually
    # reaches upstream: the anthropic->openai TRANSLATION path (claude_code
    # against this entry) and qwen_code (which passes it CLI-side). Agents that
    # hit /v1/chat/completions transparently (codex, kimi_code) forward their own
    # body, and the native anthropic entry above is byte-for-byte — neither gets
    # it injected.
    # extra_body:
    #   reasoning_effort: high

  # Google Gemini, driven by the `gemini_cli` agent. `provider: gemini` routes
  # the agent's native generateContent traffic through the proxy to Google
  # (the proxy forwards byte-for-byte and records an OpenAI-shaped projection
  # so the inspector parses it). `base_url` is the API origin only — gemini-cli
  # appends the `/v1beta/...` path itself. The key authenticates via the
  # `x-goog-api-key` header.
  gemini-2.5-pro:
    provider: gemini
    model: gemini-2.5-pro
    max_context_size: 1048576   # Gemini 2.5 Pro: 1M
    base_url: https://generativelanguage.googleapis.com
    api_key: ${GEMINI_API_KEY}
    timeout: 3600
